services:
  product-service:
    build: ./product-service
    ports:
      - "8080:8080"
    container_name: product-service
    environment:
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-key-at-least-32-characters-long}

  user-service:
    build: ./user-service
    ports:
      - "8081:8081"
    container_name: user-service
    environment:
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-key-at-least-32-characters-long}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-change-this-internal-key}

  auth-service:
    build: ./auth-service
    ports:
      - "8082:8082"
    container_name: auth-service
    environment:
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-key-at-least-32-characters-long}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-change-this-internal-key}
      USER_SERVICE_URL: http://user-service:8081
    depends_on:
      - user-service
