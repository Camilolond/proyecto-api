services:
  postgres:
    image: postgres:17
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  product-service:
    build: ./product-service
    ports:
      - "8080:8080"
    container_name: product-service
    environment:
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-key-at-least-32-characters-long}
      DB_URL: jdbc:postgresql://postgres:5432/products_db
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
    depends_on:
      postgres:
        condition: service_healthy

  user-service:
    build: ./user-service
    ports:
      - "8081:8081"
    container_name: user-service
    environment:
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-key-at-least-32-characters-long}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-change-this-internal-key}
      DB_URL: jdbc:postgresql://postgres:5432/users_db
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
    depends_on:
      postgres:
        condition: service_healthy

  auth-service:
    build: ./auth-service
    ports:
      - "8082:8082"
    container_name: auth-service
    environment:
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-key-at-least-32-characters-long}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-change-this-internal-key}
      USER_SERVICE_URL: http://user-service:8081
    depends_on:
      - user-service

volumes:
  postgres-data:
