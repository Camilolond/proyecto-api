server.port=8080
spring.application.name=proyecto-api

# Shared secret used to verify the JWTs issued by auth-service (at least 32 characters)
jwt.secret=${JWT_SECRET:change-this-secret-key-at-least-32-characters-long}

# PostgreSQL database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/products_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
# Creates or updates the tables from the entities on startup
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
