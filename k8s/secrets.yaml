# Development values, change them before deploying to a real cluster.
# The RSA private key used to sign the JWTs is NOT stored here, it is created with kubectl (see README)
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
type: Opaque
stringData:
  DB_USERNAME: postgres
  DB_PASSWORD: postgres
  INTERNAL_API_KEY: change-this-internal-key
