server.port=8081
spring.application.name=user-service

# Public keys (JWKS) of auth-service, used to verify the RS256 signature of the JWTs
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWK_SET_URI:http://localhost:8082/.well-known/jwks.json}
# Key that auth-service must send in the X-Internal-Key header to call the /internal endpoints
internal.api-key=${INTERNAL_API_KEY:change-this-internal-key}

# PostgreSQL database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/users_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
# Creates or updates the tables from the entities on startup
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
