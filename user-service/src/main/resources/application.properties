server.port=8081
spring.application.name=user-service

# Shared secret used to verify the JWTs issued by auth-service (at least 32 characters)
jwt.secret=${JWT_SECRET:change-this-secret-key-at-least-32-characters-long}
# Key that auth-service must send in the X-Internal-Key header to call the /internal endpoints
internal.api-key=${INTERNAL_API_KEY:change-this-internal-key}
