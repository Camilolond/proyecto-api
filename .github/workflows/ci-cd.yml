name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NAMESPACE: proyecto-api

jobs:
  # 1) Compile and test each service (runs on every push and PR)
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, user-service, product-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compile and run tests
        working-directory: ${{ matrix.service }}
        run: mvn -B verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.service }}
          path: ${{ matrix.service }}/target/surefire-reports
          if-no-files-found: ignore

  # 2) Build and push images to GitHub Container Registry (main only)
  publish:
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [auth-service, user-service, product-service]
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase owner (GHCR requires lowercase)
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/proyecto-api/${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ env.OWNER }}/proyecto-api/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # 3) Deploy to the local Kubernetes (Docker Desktop) via the self-hosted Windows runner
  deploy:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, windows]
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: Check cluster access
        run: |
          kubectl config use-context docker-desktop
          kubectl get nodes

      - name: Point manifests to the new images
        run: |
          $owner = $env:GITHUB_REPOSITORY_OWNER.ToLower()
          $registry = "ghcr.io/$owner/proyecto-api"
          $tag = "${{ github.sha }}"
          Get-ChildItem k8s\*-service.yaml | ForEach-Object {
            $text = Get-Content $_.FullName -Raw
            $text = $text -replace 'image: proyecto-api/([a-z-]+):1\.0\.0', ('image: ' + $registry + '/$1:' + $tag)
            Set-Content -Path $_.FullName -Value $text -NoNewline
          }

      - name: Apply manifests
        run: kubectl apply -k k8s/

      - name: Wait for rollouts
        run: |
          foreach ($d in "postgres","user-service","product-service","auth-service") {
            kubectl rollout status deployment/$d -n $env:NAMESPACE --timeout=300s
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      - name: Show result
        if: always()
        run: kubectl get pods -n $env:NAMESPACE
