server.port=8082
spring.application.name=auth-service

# RSA private key (PEM, PKCS#8) used to sign the JWTs with RS256. If the file doesnt exist a temporary key is generated
jwt.private-key-path=${JWT_PRIVATE_KEY_PATH:}
# Token lifetime in seconds
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}

# Location of user-service and the key sent in the X-Internal-Key header
user-service.url=${USER_SERVICE_URL:http://localhost:8081}
internal.api-key=${INTERNAL_API_KEY:change-this-internal-key}
