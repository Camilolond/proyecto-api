server.port=8082
spring.application.name=auth-service

# Secret used to sign the JWTs with HS256, must match the one in user-service (at least 32 characters)
jwt.secret=${JWT_SECRET:change-this-secret-key-at-least-32-characters-long}
# Token lifetime in seconds
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}

# Location of user-service and the key sent in the X-Internal-Key header
user-service.url=${USER_SERVICE_URL:http://localhost:8081}
internal.api-key=${INTERNAL_API_KEY:change-this-internal-key}
